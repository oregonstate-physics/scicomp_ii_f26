# Conda environment for Scientific Computing II.
#
#     conda env create -f environment.yml
#     conda activate scicomp
#
# Deliberately thin: conda provides the interpreter and the two system libraries
# that pip cannot, and the packages themselves come from requirements.txt. One
# list, so the conda, devcontainer and JupyterHub environments cannot drift apart
# — which is what went wrong with the previous version of this file, a machine
# dump from one laptop that hardcoded a macOS prefix, carried MKL and appnope,
# and was missing numpyro, flax and everything else the course actually uses.
#
# conda-forge only, no `defaults`: Anaconda's own channel carries licensing terms
# for institutional use that conda-forge does not.

name: scicomp

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - ffmpeg          # pydub shells out to it in the week-10 audio notebook
  - hdf5            # h5py builds against it
  - pip:
      - -r requirements.txt
